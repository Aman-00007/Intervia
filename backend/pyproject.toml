[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intervia"
version = "1.0.0"
description = "Intervia Backend — FastAPI + Nebius Token Factory (Nemotron 3)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "openai>=1.51.0",
    "cryptography>=43.0.1",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.2",
    "aioboto3>=13.1.1",
    "structlog>=24.4.0",
    "jinja2>=3.1.4",
    "pymupdf>=1.24.10",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "pycrdt-websocket>=0.15.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]